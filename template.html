<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slides</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0c0c0f;
    --fg: #e8e6e1;
    --dim: #6b6966;
    --accent: #f0c050;
    --accent2: #e06848;
    --code-bg: #1a1a20;
    --slide-max: 960px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    font-size: 13px;
    color: var(--dim);
    border-bottom: 1px solid #1e1e24;
    flex-shrink: 0;
    user-select: none;
  }
  .topbar .title {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    color: var(--fg);
    letter-spacing: .02em;
  }
  .topbar .nav { display: flex; align-items: center; gap: 10px; }
  .topbar .nav button {
    background: #18181e;
    border: 1px solid #2a2a32;
    color: var(--fg);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, border-color .15s;
  }
  .topbar .nav button:hover { background: #22222a; border-color: #3a3a44; }
  .topbar .nav button:active { background: #2a2a34; }
  .topbar .counter {
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    min-width: 56px;
    text-align: center;
    font-size: 13px;
  }
  .topbar .counter span { color: var(--fg); font-weight: 600; }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .slide {
    width: 100%;
    max-width: var(--slide-max);
    padding: 48px 64px;
    position: absolute;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity .45s cubic-bezier(.22,1,.36,1), transform .45s cubic-bezier(.22,1,.36,1);
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .slide.exit-up {
    opacity: 0;
    transform: translateY(-28px);
  }

  .slide h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 52px;
    line-height: 1.12;
    font-weight: 400;
    margin-bottom: 24px;
    letter-spacing: -.01em;
    background: linear-gradient(135deg, var(--fg) 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .slide h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    line-height: 1.2;
    font-weight: 400;
    margin-bottom: 20px;
    color: var(--fg);
  }
  .slide h3 {
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .slide p {
    font-size: 20px;
    line-height: 1.65;
    font-weight: 300;
    color: #c4c1ba;
    margin-bottom: 16px;
  }
  .slide ul, .slide ol { padding-left: 24px; margin-bottom: 16px; }
  .slide li {
    font-size: 19px;
    line-height: 1.6;
    font-weight: 300;
    color: #c4c1ba;
    margin-bottom: 8px;
  }
  .slide li::marker { color: var(--accent); }
  .slide strong { font-weight: 600; color: var(--fg); }
  .slide em { font-style: italic; color: var(--accent); }
  .slide code {
    font-family: 'JetBrains Mono', monospace;
    font-size: .85em;
    background: var(--code-bg);
    padding: 2px 7px;
    border-radius: 5px;
    border: 1px solid #28282f;
    color: var(--accent);
  }
  .slide pre {
    background: var(--code-bg);
    border: 1px solid #28282f;
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .slide pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 15px;
    line-height: 1.6;
    color: #c4c1ba;
  }
  .slide blockquote {
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 20px;
    margin-bottom: 16px;
  }
  .slide blockquote p { color: var(--dim); font-style: italic; }
  .slide hr {
    border: none;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--dim), transparent);
    margin: 28px 0;
  }

  .progress { height: 3px; background: #18181e; flex-shrink: 0; }
  .progress-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width .4s cubic-bezier(.22,1,.36,1);
    border-radius: 0 2px 2px 0;
  }

  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: .035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px; z-index: 9999;
  }

  .hint {
    position: fixed; bottom: 18px; right: 24px;
    font-size: 11px; color: #3a3a42; letter-spacing: .04em;
  }
  .hint kbd {
    display: inline-block; background: #18181e; border: 1px solid #2a2a32;
    border-radius: 4px; padding: 1px 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; margin: 0 1px;
  }
</style>
</head>
<body>
<div class="grain"></div>
<div class="topbar">
  <div class="title"><!-- __TITLE__ --></div>
  <div class="nav">
    <button onclick="navigate(-1)" aria-label="Previous">&#8249;</button>
    <div class="counter"><span id="cur">1</span> / <span id="total">0</span></div>
    <button onclick="navigate(1)" aria-label="Next">&#8250;</button>
  </div>
</div>
<div class="stage" id="stage"></div>
<div class="progress"><div class="progress-inner" id="progress"></div></div>
<div class="hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate</div>

<script>
// Injected by build script as JSON:
const SLIDES_RAW = /* __SLIDES_JSON__ */[];

// ── Tiny markdown → HTML parser ──
function md(src) {
  let html = '';
  const lines = src.split('\n');
  let i = 0;
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    return s;
  };

  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === '') { i++; continue; }

    // Fenced code block
    if (line.trim().startsWith('```')) {
      let code = ''; i++;
      while (i < lines.length && !lines[i].trim().startsWith('```')) { code += esc(lines[i]) + '\n'; i++; }
      i++;
      html += '<pre><code>' + code.trimEnd() + '</code></pre>';
      continue;
    }

    // Headings
    const hMatch = line.match(/^(#{1,3})\s+(.+)/);
    if (hMatch) {
      const lvl = hMatch[1].length;
      html += '<h' + lvl + '>' + inline(hMatch[2]) + '</h' + lvl + '>';
      i++; continue;
    }

    // Blockquote
    if (line.trim().startsWith('>')) {
      let bq = '';
      while (i < lines.length && lines[i].trim().startsWith('>')) {
        bq += lines[i].trim().replace(/^>\s?/, '') + ' '; i++;
      }
      html += '<blockquote><p>' + inline(bq.trim()) + '</p></blockquote>';
      continue;
    }

    // Unordered list
    if (/^\s*[-*]\s/.test(line)) {
      html += '<ul>';
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) {
        html += '<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'; i++;
      }
      html += '</ul>'; continue;
    }

    // Ordered list
    if (/^\s*\d+\.\s/.test(line)) {
      html += '<ol>';
      while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])) {
        html += '<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'; i++;
      }
      html += '</ol>'; continue;
    }

    // HR
    if (/^---+$/.test(line.trim())) { html += '<hr>'; i++; continue; }

    // Paragraph
    let para = '';
    while (i < lines.length && lines[i].trim() !== '' &&
      !/^#{1,3}\s/.test(lines[i]) && !/^>\s/.test(lines[i]) &&
      !/^\s*[-*]\s/.test(lines[i]) && !/^\s*\d+\.\s/.test(lines[i]) &&
      !lines[i].trim().startsWith('```') && !/^---+$/.test(lines[i].trim())) {
      para += lines[i] + ' '; i++;
    }
    html += '<p>' + inline(para.trim()) + '</p>';
  }
  return html;
}

// ── Render slides ──
let current = 0;
const stage = document.getElementById('stage');

SLIDES_RAW.forEach((src, idx) => {
  const div = document.createElement('div');
  div.className = 'slide' + (idx === 0 ? ' active' : '');
  div.innerHTML = md(src);
  stage.appendChild(div);
});

document.getElementById('total').textContent = SLIDES_RAW.length;
updateUI();

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next >= SLIDES_RAW.length) return;
  const els = stage.querySelectorAll('.slide');
  const prev = current;
  els[prev].classList.remove('active');
  els[prev].classList.add(dir > 0 ? 'exit-up' : '');
  setTimeout(() => els[prev].classList.remove('exit-up'), 450);
  current = next;
  els[current].classList.add('active');
  updateUI();
}

function updateUI() {
  document.getElementById('cur').textContent = current + 1;
  document.getElementById('progress').style.width =
    ((current + 1) / SLIDES_RAW.length * 100) + '%';
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); navigate(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); navigate(-1); }
});

stage.addEventListener('click', e => {
  const rect = stage.getBoundingClientRect();
  e.clientX < rect.left + rect.width / 2 ? navigate(-1) : navigate(1);
});
</script>
</body>
</html>
