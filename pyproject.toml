[project]
name = "glides-repo-health"
version = "0.1.0"
description = "Repository health tooling for Glides."
requires-python = ">=3.12"
dependencies = [
  "cyclopts>=3.0.0",
  "structlog>=24.0.0",
  "prek>=0.3.8",
]

[project.scripts]
glides-health = ".scripts.repo_health_cli:app"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", ".slides", ".scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
from-first = true

[tool.repo_health]
targets = ["src", ".slides"]

[tool.repo_health.prek]
default_rev = "v6.0.0"

[[tool.repo_health.prek.check_hooks]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
id = "check-json"

[[tool.repo_health.prek.check_hooks]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
id = "check-toml"

[[tool.repo_health.prek.check_hooks]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
id = "check-yaml"

[[tool.repo_health.prek.check_hooks]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
id = "check-merge-conflict"

[[tool.repo_health.prek.check_hooks]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.48.0"
id = "markdownlint"
files = "[.]md$"
args = [
  "--disable",
  "MD041",
  "MD025",
  "MD013",
  "MD033",
]

[[tool.repo_health.prek.fix_hooks]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
id = "trailing-whitespace"

[[tool.repo_health.prek.fix_hooks]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
id = "end-of-file-fixer"

[[tool.repo_health.prek.fix_hooks]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.48.0"
id = "markdownlint"
files = "[.]md$"
args = [
  "--fix",
  "--disable",
  "MD041",
  "MD025",
  "MD013",
  "MD033",
]
