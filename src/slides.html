<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/slides.css">
</head>
<body>
  <div class="grain"></div>
  <div class="topbar">
    <div class="title" id="deck-title">Project Overview</div>
    <div class="nav">
      <button id="nav-prev" aria-label="Previous">&#8249;</button>
      <div class="counter"><span id="cur">1</span> / <span id="total">0</span></div>
      <button id="nav-next" aria-label="Next">&#8250;</button>
      <button type="button" class="nav-print" id="print-pdf-btn" aria-label="Save as PDF" disabled>PDF</button>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="progress"><div class="progress-inner" id="progress"></div></div>
  <div class="hint" id="hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate · right-click slide to edit source</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js" crossorigin="anonymous"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
